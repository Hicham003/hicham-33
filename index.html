.hero{

}
.hero h1{font-size:32px;color:#9b2160;margin-bottom:12px}
.hero p{line-height:1.8}
.hero button{

color:white;

}

.search{
width:100%;
padding:15px;

.categories{

}
.categories button.active,

.products{

.card{

}
.card:hover{transform:translateY(-4px)}

width:100%;

}
.card-body{padding:15px}
.badge{
display:inline-block;
background:#ffe1ef;
color:#b52065;
padding:5px 9px;
border-radius:15px;
font-size:12px;
margin-bottom:8px;
}
.card h3{font-size:18px;margin-bottom:8px}
.card p{
font-size:13px;
line-height:1.6;
color:#765568;
min-height:42px;
}
.price{
font-size:21px;
font-weight:bold;
color:#d92778;
margin:12px 0;
}
.actions{display:flex;gap:7px}
.actions button{
flex:1;
border:0;
padding:11px 5px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}
.add{background:#351b2c;color:white}
.buy{background:#25d366;color:white}

.cart-btn{
position:fixed;
bottom:20px;
left:20px;
z-index:2000;
border:0;
background:#d92778;
color:white;
width:62px;
height:62px;
border-radius:50%;
font-size:25px;
box-shadow:0 5px 20px #0003;
cursor:pointer;
}
.cart-count{
position:absolute;
top:-5px;
right:-5px;
background:#25d366;
width:25px;
height:25px;
border-radius:50%;
font-size:13px;
display:flex;
align-items:center;
justify-content:center;
}

.overlay{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:3000;
}
.cart{
position:absolute;
right:0;
top:0;
height:100%;
width:min(430px,100%);
background:white;
padding:20px;
overflow-y:auto;
}
.cart-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}
.close{

background:#eee;
border-radius:50%;
width:40px;
height:40px;
font-size:20px;
cursor:pointer;
}
.cart-item{
display:flex;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee;
}
.cart-item img{
width:70px;
height:70px;
border-radius:12px;
object-fit:cover;
}
.cart-info{flex:1}
.cart-info h4{font-size:14px;margin-bottom:6px}
.cart-info b{color:#d92778}
.qty{
display:flex;
align-items:center;
gap:8px;

border:0;
width:28px;
height:28px;
border-radius:8px;
background:#f3d5e5;
cursor:pointer;

.remove{
border:0;
background:none;
color:#e22;
cursor:pointer;
font-size:18px;

.total{
font-size:22px;
font-weight:bold;
margin:20px 0;
color:#351b2c;

.order{
width:100%;
border:0;
padding:15px;
border-radius:15px;
background:#25d366;

footer{
margin-top:40px;
background:#351b2c;
color:white;
text-align:center;
padding:30px 15px;
line-height:2;

@media(max-width:600px){

</style>
</head>

desc:"مجموعة جميلة لروتين العناية."

cat:"مكياج",
price:199,

desc:"اختيار مميز لمحبات الجمال والأناقة."
}

];

let category="الكل";
let cart=JSON.parse(localStorage.getItem("queenCart")||"[]");

function saveCart(){
localStorage.setItem("queenCart",JSON.stringify(cart));
updateCartCount();
}

function filterCat(cat,button){
category=cat;
document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");
renderProducts();
}

function renderProducts(){

const search=document.getElementById("search").value.toLowerCase().trim();

const list=products.filter(p=>
(category==="الكل"||p.cat===category) &&
(p.name.toLowerCase().includes(search)||p.desc.toLowerCase().includes(search))
);

const box=document.getElementById("products");

if(!list.length){
box.innerHTML='<div class="empty">😔 لم نجد أي منتج بهذا الاسم</div>';
return;
}

box.innerHTML=list.map(p=>`

<div class="card">

<img src="${p.img}" alt="${p.name}">

<div class="card-body">

<span class="badge">${p.cat}</span>

<h3>${p.name}</h3>

<p>${p.desc}</p>

<div class="price">${p.price} DH</div>

<div class="actions">

<button class="add" onclick="addToCart(${p.id})">
🛒 أضف
</button>

<button class="buy" onclick="buyNow(${p.id})">
💬 اطلب
</button>

</div>

</div>
</div>

`).join("");

}

function addToCart(id){

const item=cart.find(x=>x.id===id);

if(item){
item.qty++;
}else{
cart.push({id:id,qty:1});
}

saveCart();

}

function buyNow(id){

addToCart(id);
openCart();

}

function updateCartCount(){

const count=cart.reduce((sum,x)=>sum+x.qty,0);

document.getElementById("cartCount").textContent=count;

}

function openCart(){

document.getElementById("overlay").style.display="block";
renderCart();

}

function closeCart(){

document.getElementById("overlay").style.display="none";

}

function changeQty(id,amount){

const item=cart.find(x=>x.id===id);

if(!item)return;

item.qty+=amount;

if(item.qty<=0){
cart=cart.filter(x=>x.id!==id);
}

saveCart();
renderCart();

}

function removeItem(id){

cart=cart.filter(x=>x.id!==id);

saveCart();
renderCart();

}

function renderCart(){

const box=document.getElementById("cartItems");

if(!cart.length){

box.innerHTML='<div class="empty">🛍️ السلة فارغة<br><br>اختاري منتجاتك الجميلة أولاً 💕</div>';

document.getElementById("cartTotal").textContent="المجموع: 0 DH";

return;

}

let total=0;

box.innerHTML=cart.map(item=>{

const p=products.find(x=>x.id===item.id);

const subtotal=p.price*item.qty;

total+=subtotal;

return `

<div class="cart-item">

<img src="${p.img}">

<div class="cart-info">

<h4>${p.name}</h4>

<b>${p.price} DH</b>

<div class="qty">

<button onclick="changeQty(${p.id},-1)">−</button>

<span>${item.qty}</span>

<button onclick="changeQty(${p.id},1)">+</button>

<button class="remove" onclick="removeItem(${p.id})">🗑️</button>

</div>

</div>

</div>

`;

}).join("");

document.getElementById("cartTotal").textContent=
"المجموع: "+total+" DH";

}

function sendWhatsApp(){

if(!cart.length){

alert("السلة فارغة. أضف منتجًا أولاً.");

return;

}

let message="👑 *QUEEN BEAUTY*%0A";
message+="━━━━━━━━━━━━%0A";
message+="🛍️ *طلب جديد*%0A%0A";

let total=0;

cart.forEach(item=>{

const p=products.find(x=>x.id===item.id);

const subtotal=p.price*item.qty;

total+=subtotal;

message+="💄 "+encodeURIComponent(p.name)+"%0A";
message+="الكمية: "+item.qty+"%0A";
message+="السعر: "+subtotal+" DH%0A%0A";

});

message+="━━━━━━━━━━━━%0A";
message+="💰 *المجموع: "+total+" DH*%0A%0A";
message+="📍 الاسم:%0A";
message+="📍 العنوان:%0A";
message+="📞 الهاتف:%0A%0A";
message+="شكراً لاختياركم QUEEN BEAUTY 👑💕";

const phone="212715136475";

window.open(
"https://wa.me/"+phone+"?text="+message,
"_blank"
);

}

document.getElementById("overlay").addEventListener("click",function(e){

if(e.target===this){
closeCart();
}

});

renderProducts();
updateCartCount();
